[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pscnc"
version = "0.1.0"
description = "Plataforma B2B de Firma Electronica No Cualificada (PSCNC) - Paraguay"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "PSCNC Paraguay" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.12",
    "boto3>=1.35,<2.0",
    "botocore>=1.35,<2.0",
    # El extra `qr` trae `qrcode`, que pyHanko necesita para el sello con QR
    # del bloque de constancia. Sin él la firma con apariencia falla en tiempo
    # de ejecución y no al arrancar, que es el peor momento para enterarse.
    "pyhanko[pkcs11,qr]>=0.25,<1.0",
    "pyhanko-certvalidator>=0.26,<1.0",
    "asn1crypto>=1.5,<2.0",
    # >=6.14.2 corrige las CVE de denegación de servicio por PDF manipulado.
    "pypdf>=6.14.2,<7.0",
    "cryptography>=43.0",
    "requests>=2.32,<3.0",
    "reportlab>=4.2,<5.0",
    "structlog>=24.4,<25.0",
    # Canonicalización JSON (RFC 8785). Sin un orden de claves determinista,
    # dos serializaciones del mismo acta dan hashes distintos y la
    # verificación falla por motivos ajenos a la integridad.
    "rfc8785>=0.1,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx2>=2.0",          # requerido por starlette.testclient (pruebas de la API)
    # Verificación del sello con una librería JOSE ajena a la que lo produce:
    # verificar con el mismo código que firma no demuestra interoperabilidad.
    "jwcrypto>=1.5",
    "moto[dynamodb,s3,kms]>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "bandit>=1.7",
    "types-requests",
    "boto3-stubs[dynamodb,kms,s3,secretsmanager]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: ejercita el motor de firma completo (más lento; requiere pyHanko)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",  # assert permitido en pruebas
    "N815",  # atributos en mayusculas requeridos por el esquema DynamoDB (PK, SK, GSI1PK)
]

[tool.ruff.lint.per-file-ignores]
# N803: los dobles de servicios externos replican la firma de su API, que en
# boto3 usa PascalCase. Renombrar los argumentos rompería el doble.
"tests/*" = ["S105", "S106", "S311", "N803"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests"]

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
]
