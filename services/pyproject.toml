[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pscnc"
version = "0.1.0"
description = "Plataforma B2B de Firma Electronica No Cualificada (PSCNC) - Paraguay"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "PSCNC Paraguay" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.12",
    "boto3>=1.35,<2.0",
    "botocore>=1.35,<2.0",
    "pyhanko[pkcs11]>=0.25,<1.0",
    "pyhanko-certvalidator>=0.26,<1.0",
    "asn1crypto>=1.5,<2.0",
    "pypdf>=5.0,<7.0",
    "cryptography>=43.0",
    "requests>=2.32,<3.0",
    "reportlab>=4.2,<5.0",
    "structlog>=24.4,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx2>=2.0",          # requerido por starlette.testclient (pruebas de la API)
    "moto[dynamodb,s3,kms]>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "bandit>=1.7",
    "types-requests",
    "boto3-stubs[dynamodb,kms,s3,secretsmanager]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: ejercita el motor de firma completo (más lento; requiere pyHanko)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",  # assert permitido en pruebas
    "N815",  # atributos en mayusculas requeridos por el esquema DynamoDB (PK, SK, GSI1PK)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests"]
