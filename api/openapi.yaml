openapi: 3.1.0
info:
  title: PSCNC · API de Firma Electrónica No Cualificada
  description: 'Contrato público de FirmasNoCualificadas.


    Reglas que un integrador debe conocer antes de programar:


    - La decisión de identidad llega **tomada por el tenant**; el servicio la asienta como evidencia y
    no la revisa.

    - El OTP verificado por el tenant viaja como prueba, nunca el código.

    - El modo predeterminado es *hash-only*: el documento no se envía.

    - Las escrituras exigen `Idempotency-Key`; una confirmación repetida devuelve el acta original.

    - Todo rechazo trae un `motivo` de un enumerado estable, nunca un mensaje libre.'
  version: 0.1.0
paths:
  /v1/transactions:
    post:
      tags:
      - transacciones
      summary: Crear Transaccion
      description: 'Abre una transacción de firma.


        La decisión de identidad llega tomada por el tenant y se asienta como

        evidencia; FNC no la revisa (ADR-0009).'
      operationId: crear_transaccion_v1_transactions_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionCreated'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/transactions/{transaction_id}/confirm:
    post:
      tags:
      - transacciones
      summary: Confirmar Transaccion
      description: 'Confirma el acto y devuelve el acta sellada.


        Una confirmación repetida con la misma clave devuelve **el acta original**.'
      operationId: confirmar_transaccion_v1_transactions__transaction_id__confirm_post
      parameters:
      - name: transaction_id
        in: path
        required: true
        schema:
          type: string
          title: Transaction Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmTransactionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionConfirmed'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
  /v1/transactions/{transaction_id}/artifacts:
    get:
      tags:
      - transacciones
      summary: Obtener Artefactos
      description: Recupera el acta sellada y el código de verificación.
      operationId: obtener_artefactos_v1_transactions__transaction_id__artifacts_get
      parameters:
      - name: transaction_id
        in: path
        required: true
        schema:
          type: string
          title: Transaction Id
      responses:
