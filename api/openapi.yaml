      summary: Confirmar Firma
      description: Verifica el consentimiento y aplica la firma PAdES-B-T con sello de tiempo.
      operationId: confirmar_firma_v1_signing_sessions__session_id__confirm_post
      parameters:
      - name: session_id
        in: path
