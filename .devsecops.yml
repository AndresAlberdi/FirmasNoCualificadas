    - id: CKV_AWS_91
      herramienta: checkov
      componente: infra
      justificacion: >-
        Registro de acceso del balanceador. Depende del bucket de logs de CKV_AWS_18 y se incorpora con él.
      aprobado_por: segurolotengopy
      creado: "2026-09-02"
      vence: "2026-12-02"
    - id: CKV_AWS_117
      herramienta: checkov
      componente: infra
      justificacion: >-
        Función de CRL dentro de una VPC. Publica un archivo público en S3 y CloudFront y no accede a ningún recurso privado; meterla en la VPC exigiría endpoints o NAT sin reducir superficie.
      aprobado_por: segurolotengopy
      creado: "2026-09-02"
      vence: "2026-12-02"
