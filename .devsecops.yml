    - id: AWS-0011
      herramienta: trivy
      componente: infra
      justificacion: >-
        La distribución de CloudFront que publica la lista de revocación no tiene
        WAF. El contenido es público por diseño y está firmado por la CA, así que
        no hay confidencialidad ni integridad que un WAF proteja; el riesgo real
        es de disponibilidad y costo por tráfico anómalo. El WAF con limitación
        de tasa se incorpora en la fase de infraestructura, junto con el resto
        del perímetro que describe el blueprint. No hay infraestructura desplegada
        (produccion: false), de modo que hoy el hallazgo no tiene exposición.
      aprobado_por: segurolotengopy
      creado: "2026-09-02"
      vence: "2026-12-02"
    - id: AWS-0104
      herramienta: trivy
      componente: infra
      justificacion: >-
        El grupo de seguridad del motor de firma permite salida a 0.0.0.0/0 en el
        puerto 443 únicamente. El servicio necesita alcanzar la TSA cualificada,
        cuyo rango de direcciones se conocerá al contratarla (B-01 de
        docs/PENDIENTES.md), y los servicios de AWS. La corrección definitiva son
        los VPC endpoints para los servicios de AWS más un egreso restringido al
        rango de la TSA, y se aborda en la fase de infraestructura. No hay
        infraestructura desplegada, de modo que hoy el hallazgo no tiene exposición.
      aprobado_por: segurolotengopy
      creado: "2026-09-02"
      vence: "2026-12-02"
