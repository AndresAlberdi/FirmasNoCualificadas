    - id: CKV_AWS_18
      herramienta: checkov
      componente: infra
      justificacion: >-
        Registro de acceso a los buckets. Exige un bucket de logs aparte con su propio ciclo de vida y política; se incorpora junto con el resto del perímetro en la fase de infraestructura. Los accesos a las claves ya quedan registrados en CloudTrail, que es la traza que sostiene la auditabilidad de una firma.
      aprobado_por: segurolotengopy
      creado: "2026-09-02"
      vence: "2026-12-02"
    - id: CKV_AWS_309
      herramienta: checkov
      componente: infra
      justificacion: >-
        Tipo de autorización de las rutas de API Gateway. La autenticación del servicio es HMAC-SHA256 verificada en la aplicación, con el inquilino derivado de la credencial (ADR-0005): un autorizador de API Gateway no aportaría el contexto de inquilino que el repositorio necesita, y duplicaría el control en dos lugares que pueden divergir.
      aprobado_por: segurolotengopy
      creado: "2026-09-02"
      vence: "2026-12-02"
    - id: CKV_AWS_382
      herramienta: checkov
      componente: infra
      justificacion: >-
        Egreso sin restringir en el grupo de seguridad del motor de firma, limitado al puerto 443. Mismo caso que la excepción AWS-0104 de Trivy: el servicio necesita alcanzar la autoridad de sellado de tiempo, cuyo rango se conocerá al contratarla (B-01). La corrección definitiva son los VPC endpoints más el egreso acotado (T-08).
      aprobado_por: segurolotengopy
      creado: "2026-09-02"
      vence: "2026-12-02"
