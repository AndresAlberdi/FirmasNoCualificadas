      componente: infra
      justificacion: >-
        Protección contra borrado del balanceador. En `dev` se omite a propósito para poder reconstruir el entorno; se habilita en producción, donde el recurso sí es duradero.
      aprobado_por: segurolotengopy
      creado: "2026-09-02"
