    - id: CKV_AWS_28
      herramienta: checkov
      componente: infra
      justificacion: >-
        Recuperación a un punto en el tiempo en la tabla de idempotencia. Se desactiva a propósito: a diferencia de la evidencia, perder estos registros no destruye una prueba, y lo peor que produce es que un reintento se ejecute dos veces, cosa que la transacción ya rechaza. La tabla de auditoría sí lo tiene habilitado.
      aprobado_por: segurolotengopy
      creado: "2026-09-02"
      vence: "2026-12-02"
    - id: CKV_AWS_272
      herramienta: checkov
      componente: infra
      justificacion: >-
        Validación de firma de código en la función de publicación de CRL. Exige un perfil de firma de AWS Signer y un flujo de publicación firmado, que no existe todavía; el artefacto se construye en el mismo pipeline que lo despliega. Se aborda junto con la firma de artefactos de la cadena de suministro.
      aprobado_por: segurolotengopy
      creado: "2026-09-02"
      vence: "2026-12-02"
    - id: CKV_AWS_252
      herramienta: checkov
      componente: infra
      justificacion: >-
        Tema de SNS en CloudTrail. Las alarmas de seguridad ya publican en el tema de SecOps por CloudWatch, que es donde la guardia las recibe; una notificación por cada entrega de archivo de CloudTrail añadiría ruido sin destinatario que lo lea.
      aprobado_por: segurolotengopy
      creado: "2026-09-02"
      vence: "2026-12-02"
    - id: CKV2_AWS_3
      herramienta: checkov
      componente: infra
      justificacion: >-
        GuardDuty. Está parametrizado por `enable_guardduty` y se activa en los entornos que lo justifiquen; encenderlo en todos multiplicaría el costo del entorno de desarrollo sin señal que lo aproveche.
      aprobado_por: segurolotengopy
      creado: "2026-09-02"
      vence: "2026-12-02"
    - id: CKV2_AWS_64
      herramienta: checkov
      componente: infra
      justificacion: >-
        Política de clave definida. Las claves del servicio la declaran de forma explícita (ADR-0006); el hallazgo alcanza a claves auxiliares del entorno de desarrollo, que usan la política predeterminada de la cuenta.
      aprobado_por: segurolotengopy
      creado: "2026-09-02"
      vence: "2026-12-02"
    - id: CKV_AWS_109
      herramienta: checkov
      componente: infra
      justificacion: >-
        Permisos de gestión sin restricción en políticas de IAM. Corresponden a las sentencias de administración de las claves, acotadas por principal a los roles de SecOps; el comodín está en el recurso porque una política de clave se evalúa sobre la clave que la contiene, no sobre un ARN externo.
      aprobado_por: segurolotengopy
      creado: "2026-09-02"
      vence: "2026-12-02"
