# =============================================================================
# trivy.yaml — Configuración base de Trivy (fs, image, config)
# Versión: 2.0 | Fecha: 2026-08-24 | Destino: .github/trivy.yaml
# -----------------------------------------------------------------------------
# Los workflows pasan `trivy-config: .github/trivy.yaml`. Los parámetros
# explícitos del workflow (severity, exit-code, format, scanners) tienen
# prioridad sobre este archivo; aquí van los valores comunes y las exclusiones.
# Referencia: https://trivy.dev/latest/docs/references/configuration/config-file/
# =============================================================================

# Tiempo máximo por escaneo (imágenes grandes o monorepos)
timeout: 10m

# Severidades reportadas por defecto (los workflows bloquean en CRITICAL,HIGH;
# MEDIUM se reporta en el informe para planificar su corrección)
#
# Se conserva a propósito, aunque la plantilla del estándar la quitó. Su motivo
# —que este valor anula el `bloquear_en` del workflow— no se cumple, y se
# comprobó con Trivy 0.70.0 (la versión que instala trivy-action v0.36.0):
#   - `--severity` y `TRIVY_SEVERITY` tienen prioridad sobre este archivo.
#   - trivy-action exporta `TRIVY_SEVERITY` con el input `severity`, y solo lo
#     borra en SARIF cuando falta `limit-severities-for-sarif: true`.
# En ese último caso es cuando este valor pesa, y quitarlo empeora las cosas:
# sin él, Trivy bloquea por cualquier hallazgo, LOW incluido. Lo que evita el
# bloqueo por MEDIUM es `limit-severities-for-sarif`, que los pasos de Trivy
# con salida SARIF ya fijan en `_reusable-security.yml`.
severity:
  - CRITICAL
  - HIGH
  - MEDIUM

# Código de salida cuando hay hallazgos de las severidades indicadas
exit-code: 1

# Escáneres por defecto para `trivy fs` (los workflows los acotan con --scanners)
scan:
  scanners:
    - vuln
    - misconfig
    - secret
  # Patrones con `**/` porque este repositorio es un monorepo: los directorios
  # a excluir cuelgan de `services/` y `dashboard/`, no de la raíz, y un patrón
  # sin comodín no los alcanza. Sin esto, Trivy analiza el entorno virtual y
  # reporta como hallazgos las claves y credenciales de prueba que traen las
  # propias dependencias (por ejemplo las de `moto`).
  skip-dirs:
    - "**/node_modules"
    - "**/.git"
    - "**/dist"
    - "**/build"
    - "**/coverage"
    - "**/.venv"
    - "**/venv"
    - "**/.terraform"
    - "**/.security-reports"
    # Checkouts del PROPIO repositorio: analizarlos duplica cada hallazgo del
    # proyecto en vez de descubrir uno nuevo. No oculta nada — el mismo archivo
    # se analiza igual en su ruta real.
    - "**/.claude/worktrees"
  skip-files:
    - "**/*.min.js"
    - "**/*.map"

vulnerability:
  # No bloquear por CVEs sin parche disponible: no hay acción posible salvo
  # cambiar la imagen base. Se registran en el informe.
  ignore-unfixed: true

pkg:
  # Tipos: os (paquetes del SO de la imagen) y library (dependencias de la app).
  # Antes era `vulnerability.type`, que Trivy 0.70 declara obsoleto.
  types:
    - os
    - library

misconfiguration:
  include-non-failures: false
  # Revisa las políticas embebidas de Trivy (Docker CIS, Terraform, K8s).
  #
  # Solo nombres que Trivy acepta. La lista tenía `dockercompose` y
  # `github-actions`, que no son escáneres de Trivy 0.70: ante un nombre inválido
  # Trivy registra un ERROR y DESCARTA LA LISTA ENTERA en favor de la suya por
  # defecto, de modo que esta sección no controlaba nada. Los workflows los
  # revisa checkov (reglas CKV_GHA_*); Compose no se usa en este repositorio.
  scanners:
    - terraform
    - dockerfile
    - kubernetes
    - helm

secret:
  # Gitleaks es el escáner principal de secretos; Trivy actúa como red de
  # seguridad en imágenes (capas con .env, claves, tokens).
  config: .github/trivy-secret.yaml # opcional; si no existe se ignora

db:
  # Se descarga la base de vulnerabilidades en cada run (caché en el runner).
  # Para reducir descargas en repos con muchos runs, considere un mirror OCI.
  skip-update: false

cache:
  # Recuerde ignorar este directorio en git (.gitignore: .trivy-cache/)
  dir: .trivy-cache

# Excepciones (D5): la ÚNICA fuente es `seguridad.excepciones[]` del manifiesto
# .devsecops.yml. El archivo .trivyignore.yaml se GENERA en runtime desde el
# manifiesto (_reusable-security.yml y security-local.sh); NO se edita a mano
# ni se versiona.
ignorefile: .trivyignore.yaml # generado desde .devsecops.yml
