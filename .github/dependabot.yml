# =============================================================================
# dependabot.yml — Actualización automática de dependencias y de pines por SHA
# Versión: 2.2 | Revisado: 2026-09-12
# -----------------------------------------------------------------------------
# CORREGIDO (2026-09-05). La versión anterior venía de la plantilla del estándar
# y tenía dos problemas que se anulaban entre sí:
#
#  1. La entrada de npm dejaba `ignore` como lista VACÍA (`[]`). Dependabot
#     exige al menos un elemento y, ante el error, RECHAZA EL ARCHIVO ENTERO:
#     las actualizaciones de VERSIÓN no corrían en ningún ecosistema.
#
#     Las de SEGURIDAD sí seguían llegando —Dependabot las dispara desde sus
#     alertas, sin leer este archivo—, y por eso el fallo pasaba desapercibido:
#     el repositorio mostraba PR de Dependabot recientes y parecía sano.
#     (La PR de `pypdf` en `/services` era una de esas.)
#
#  2. Los ecosistemas apuntaban a directorios donde NO HAY MANIFIESTOS: npm,
#     pip y docker en `/`, cuando este repositorio los tiene en `/dashboard`,
#     `/sdk/typescript` y `/services`. Aunque el archivo hubiera sido válido,
#     Dependabot no habría encontrado nada que actualizar y habría fallado cada
#     semana.
#
# Los directorios de abajo salen de los manifiestos que existen de verdad:
#   /.github/workflows      → github-actions
#   /dashboard/package.json → npm
#   /sdk/typescript/package.json → npm
#   /services/pyproject.toml + uv.lock → uv
#   /services/Dockerfile    → docker
#   /infra/terraform/envs/dev/*.tf → terraform
#
# `cooldown`: no adoptar una versión el día que sale. Una release comprometida
# se detecta casi siempre en las primeras horas, que es justo cuando Dependabot
# la propondría. `semver-*-days` solo vale en ecosistemas que versionan con
# semver: pasárselo a github-actions, docker o terraform hace que Dependabot
# rechace el archivo entero.
#
# ALINEADO CON EL ESTÁNDAR (2026-09-12). Las versiones mayores de npm y uv
# quedan fuera de la automatización, como fija la política del estándar
# (SeguridadGeneral, 01-seguridad/04 §7.2): se revisan una vez al mes, a mano,
# con notas de cambio. Las de github-actions, docker y terraform siguen
# llegando en PR individuales. También se separan en npm los grupos de
# producción y de desarrollo, y se agrupan los menores de terraform.
#
# OJO: la exclusión (`ignore`) también frena las actualizaciones de SEGURIDAD
# que exijan una versión mayor. La alerta sigue apareciendo en Dependabot
# alerts, pero el PR no se abre solo: se abre a mano, dentro de las 72 h que
# la política fija para los parches HIGH/CRITICAL.
# =============================================================================
version: 2

updates:
  # ---- GitHub Actions: pines por SHA de todos los workflows -------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/La_Paz
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencias, github-actions, seguridad]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # ---- npm — panel web --------------------------------------------------------
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/La_Paz
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 10
    labels: [dependencias, npm, dashboard]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    versioning-strategy: increase
    groups:
      dashboard-produccion-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      dashboard-desarrollo:
        dependency-type: development
        update-types: [minor, patch]
    # Mayores: revisión mensual manual (ver encabezado).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---- npm — SDK de TypeScript ------------------------------------------------
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/La_Paz
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    labels: [dependencias, npm, sdk]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    versioning-strategy: increase
    groups:
      sdk-produccion-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      sdk-desarrollo:
        dependency-type: development
        update-types: [minor, patch]
    # Mayores: revisión mensual manual (ver encabezado).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---- uv — servicios de Python -----------------------------------------------
  # `uv`, no `pip`: /services trae pyproject.toml y uv.lock. Es el ecosistema
  # que las propias PR de seguridad de este repositorio ya usaban (etiqueta
  # `python:uv`).
  - package-ecosystem: uv
    directory: /services
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/La_Paz
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 10
    labels: [dependencias, python, services]
    commit-message:
      prefix: "chore(deps)"
    groups:
      services-minor-patch:
        update-types: [minor, patch]
    # Mayores: revisión mensual manual (ver encabezado).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---- Docker — imagen base de los servicios ----------------------------------
  - package-ecosystem: docker
    directory: /services
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/La_Paz
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels: [dependencias, docker, seguridad]
    commit-message:
      prefix: "chore(docker)"

  # ---- Terraform — infraestructura --------------------------------------------
  - package-ecosystem: terraform
    directory: /infra/terraform/envs/dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/La_Paz
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels: [dependencias, terraform, infra]
    commit-message:
      prefix: "chore(infra)"
    groups:
      terraform-minor-patch:
        update-types: [minor, patch]
