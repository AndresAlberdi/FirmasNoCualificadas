name: CI · Infraestructura

on:
  push:
    branches: [main, develop]
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read
  id-token: write # autenticación OIDC con AWS; sin credenciales estáticas
  pull-requests: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Formato, validación y análisis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Formato HCL
        run: terraform fmt -check -recursive infra/terraform

      - name: Validar módulos
        run: |
          for modulo in infra/terraform/modules/*/; do
            echo "── $modulo"
            terraform -chdir="$modulo" init -backend=false -input=false
            terraform -chdir="$modulo" validate
          done

      - name: Validar entorno dev
        run: |
          terraform -chdir=infra/terraform/envs/dev init -backend=false -input=false
          terraform -chdir=infra/terraform/envs/dev validate

      - name: Análisis de seguridad de la infraestructura (checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/terraform
          framework: terraform
          soft_fail: false
          # Excepciones justificadas y revisadas:
          #   CKV_AWS_144 — replicación entre regiones: pendiente de decisión de residencia de datos
          skip_check: CKV_AWS_144

  plan:
    name: Plan del entorno dev
    needs: validar
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Plan
        id: plan
        run: |
          terraform -chdir=infra/terraform/envs/dev init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=pscnc-tfstate-lock"
          terraform -chdir=infra/terraform/envs/dev plan -no-color -input=false
        continue-on-error: true

      - name: Publicar el resultado en el pull request
        if: always()
        run: echo "El plan es evidencia de control de cambios ante la DGFDCE; revisar antes de aprobar."
