name: Seguridad

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Barrido semanal: las vulnerabilidades aparecen en dependencias que no cambian.
    - cron: "0 9 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  secretos:
    name: Detección de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codigo:
    name: Análisis estático de seguridad (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit[toml]
      - name: Bandit
        run: bandit -c services/pyproject.toml -r services/src -ll

  dependencias:
    name: Vulnerabilidades en dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Auditoría de dependencias de Python
        run: |
          pip install -e services
          pip-audit --strict --progress-spinner off
        continue-on-error: true

  imagen:
    name: Análisis de la imagen del servicio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: |
          mkdir -p services/deploy
          # Certificado ficticio para que la construcción no dependa del material real.
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/ci.key \
            -out services/deploy/ca-intermediate.crt -days 1 -nodes \
            -subj "/C=PY/CN=CI Placeholder"
          docker build -t pscnc/signer:ci services
      - name: Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pscnc/signer:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
